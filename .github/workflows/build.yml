name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test -p p4g-core
      - name: Build wasm
        run: cargo build -p p4g-wasm --release --target wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked
      - name: Generate JS bindings
        run: wasm-bindgen --target web --out-dir web/pkg target/wasm32-unknown-unknown/release/p4g_wasm.wasm
      - uses: actions/setup-node@v6
      - name: Smoke test
        run: node tests/wasm-smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: P4GSaveEditor-web
          path: web/*
          if-no-files-found: error
