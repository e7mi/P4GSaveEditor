[package]
name = "p4g-save-editor"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = "0.4"
encoding_rs = "0.8"
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
md5 = "0.7"
rfd = "0.15"
serde = "1"
serde_json = "1"
unicode-segmentation = "1"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
