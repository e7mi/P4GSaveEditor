[workspace]
members = ["crates/p4g-core", "crates/p4g-wasm"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
chrono = "0.4"
encoding_rs = "0.8"
md5 = "0.7"
serde = "1"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
